spring.application.name=ms-solicitudes
server.port=8081

# MySQL local
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/solicitudes_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Entra ID: se activa cuando SECURITY_ENABLED=true
security.enabled=${SECURITY_ENABLED:false}
